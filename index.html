<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subham ❤️ Puja | Our Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #14080e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ENVELOPE SCREEN */
    #envelope-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #3b121e 0%, #14060a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 1s ease, transform 1s ease;
    }

    #envelope-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.1);
    }

    .envelope-wrapper {
      cursor: pointer;
      position: relative;
      width: 260px;
      height: 170px;
      background: linear-gradient(135deg, #e8dcc5, #cbb692);
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(-8deg);
      transition: transform 0.4s ease;
      animation: pulseEnv 2.5s infinite ease-in-out;
    }

    .envelope-wrapper:hover {
      transform: rotate(-4deg) scale(1.05);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 95px solid #d7c3a1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .wax-seal {
      width: 48px;
      height: 48px;
      background: radial-gradient(circle at 30% 30%, #c92a2a, #7a1111);
      border-radius: 50%;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 8px rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #f3c6c6;
      border: 2px solid #9e1b1b;
    }

    .tap-text {
      margin-top: 35px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #e6ccb2;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    @keyframes pulseEnv {
      0%, 100% { transform: rotate(-8deg) translateY(0); }
      50% { transform: rotate(-8deg) translateY(-8px); }
    }

    /* MAIN STORY SCREEN */
    #main-screen {
      position: relative;
      width: 100%;
      height: 100%;
      /* Starry Twilight River Background */
      background: 
        radial-gradient(ellipse at 70% 20%, rgba(168, 85, 247, 0.35), transparent 50%),
        radial-gradient(ellipse at 25% 30%, rgba(236, 72, 153, 0.25), transparent 55%),
        linear-gradient(180deg, #1b1438 0%, #3d2459 45%, #6b4c6e 75%, #2b1d38 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Twinkling Stars */
    .stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 40px 70px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90px 40px, #ffe6fa, transparent),
        radial-gradient(2px 2px at 160px 120px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 230px 80px, #ffd6e7, transparent),
        radial-gradient(2px 2px at 300px 150px, #fff, transparent);
      background-size: 350px 250px;
      animation: twinkle 4s infinite alternate;
      pointer-events: none;
    }

    @keyframes twinkle {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Top Header */
    .top-header {
      position: absolute;
      top: 22px;
      text-align: center;
      z-index: 10;
    }

    .top-header .badge {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #f8e1f4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .top-header .sub-badge {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #e2c2e8;
      margin-top: 4px;
    }

    /* Center Names & Lyrics */
    .center-content {
      z-index: 15;
      text-align: center;
      padding: 0 20px;
      max-width: 90%;
    }

    .couple-name {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.7rem, 5vw, 2.8rem);
      font-weight: 700;
      color: #fff6e5;
      letter-spacing: 2px;
      text-shadow: 0 0 18px rgba(255, 182, 193, 0.8), 0 4px 12px rgba(0,0,0,0.6);
      margin-bottom: 22px;
    }

    .lyrics-box {
      min-height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #lyric-line {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #ffe8f3;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #lyric-line.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* POLAROID FRAMES */
    .polaroid {
      position: absolute;
      background: #ffffff;
      padding: 8px 8px 24px 8px;
      border-radius: 4px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      width: clamp(95px, 22vw, 145px);
      z-index: 8;
      transition: transform 0.4s ease;
    }

    .polaroid img {
      width: 100%;
      height: clamp(95px, 22vw, 140px);
      object-fit: cover;
      display: block;
      background: #f0e6ef;
    }

    .polaroid:hover {
      transform: scale(1.12) rotate(0deg) !important;
      z-index: 25;
    }

    /* 6 Polaroid Positions matching the video */
    .p1 { top: 10%; left: 5%; transform: rotate(-10deg); animation: float1 5s ease-in-out infinite; }
    .p2 { top: 38%; left: 4%; transform: rotate(6deg); animation: float2 6s ease-in-out infinite; }
    .p3 { bottom: 10%; left: 6%; transform: rotate(-8deg); animation: float1 5.5s ease-in-out infinite; }

    .p4 { top: 11%; right: 5%; transform: rotate(9deg); animation: float2 5.2s ease-in-out infinite; }
    .p5 { top: 39%; right: 4%; transform: rotate(-7deg); animation: float1 6.2s ease-in-out infinite; }
    .p6 { bottom: 10%; right: 6%; transform: rotate(8deg); animation: float2 5.8s ease-in-out infinite; }

    @keyframes float1 {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    @keyframes float2 {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 10px; }
    }

    /* Floating Butterflies & Sparkles */
    .particle {
      position: absolute;
      font-size: 16px;
      pointer-events: none;
      animation: flyUp 8s linear infinite;
      opacity: 0.75;
      z-index: 5;
    }

    @keyframes flyUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Music Control Button */
    #music-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      z-index: 50;
    }
  </style>
</head>
<body>

  <!-- ENVELOPE INTRO -->
  <div id="envelope-screen" onclick="openStory()">
    <div class="envelope-wrapper">
      <div class="envelope-flap"></div>
      <div class="wax-seal">❤️</div>
    </div>
    <p class="tap-text">Tap the envelope to open</p>
  </div>

  <!-- MAIN STORY PAGE -->
  <div id="main-screen">
    <div class="stars"></div>

    <div class="top-header">
      <div class="badge">JUST FOR U 💍</div>
      <div class="sub-badge">• | .OUR STORY .| •</div>
    </div>

    <!-- 6 POLAROID PHOTOS (Replace src with your photo filenames) -->
    <div class="polaroid p1"><img src="IMG_20261109_151314.jpg" alt="Memory 1"></div>
    <div class="polaroid p2"><img src="IMG_20261030_142707.jpg" alt="Memory 2"></div>
    <div class="polaroid p3"><img src="IMG_20261030_142837.jpg" alt="Memory 3"></div>
    <div class="polaroid p4"><img src="IMG_20260904_221224.jpg" alt="Memory 4"></div>
    <div class="polaroid p5"><img src="IMG-20261113-WA0029.jpg" alt="Memory 5"></div>
    <div class="polaroid p6"><img src="IMG_20260914_114542589_HDR.jpg" alt="Memory 6"></div>

    <!-- CENTER TITLE & LYRICS -->
    <div class="center-content">
      <h1 class="couple-name">Subham ❤️ Puja</h1>
      <div class="lyrics-box">
        <p id="lyric-line">Zara Paas Tu Aa Mere...</p>
      </div>
    </div>

    <button id="music-btn" onclick="toggleMusic()">🔊 Pause</button>
  </div>

  <!-- BACKGROUND SONG (Upload tere-liye.mp3 in same GitHub folder) -->
  <audio id="bg-music" loop>
    <source src="tere liye.mp3" type="audio/mpeg">
  </audio>

  <script>
    const lyrics = [
      { time: 0, text: "Zara Paas Tu Aa Mere..." },
      { time: 4000, text: "Dheere Se Chu Ja Mujhe..." },
      { time: 8000, text: "Kho Jaaun Tere Pyaar Mein..." },
      { time: 12000, text: "Baahon Mein Bhar Le Mujhe..." },
      { time: 16500, text: "Oooo Ooooo..." },
      { time: 20500, text: "Tere Liye Jhoomoon Deewana Ban Ke..." },
      { time: 25000, text: "Tere Liye..." },
      { time: 29000, text: "Vaada Hai Mera..." },
      { time: 33000, text: "Main Hoon Tere Liye..." },
      { time: 37500, text: "Hona Kabhi Tu Judaa..." },
      { time: 41500, text: "Hoo Bhikhari Teri Khushbuyein..." }
    ];

    const audio = document.getElementById('bg-music');
    const lyricEl = document.getElementById('lyric-line');
    const musicBtn = document.getElementById('music-btn');
    let isPlaying = false;

    function openStory() {
      document.getElementById('envelope-screen').classList.add('hidden');
      audio.play().then(() => {
        isPlaying = true;
      }).catch(() => {
        musicBtn.textContent = "🔇 Play Song";
      });
      startLyrics();
      createParticles();
    }

    function startLyrics() {
      function playCycle() {
        lyrics.forEach((line) => {
          setTimeout(() => {
            lyricEl.classList.remove('active');
            setTimeout(() => {
              lyricEl.textContent = line.text;
              lyricEl.classList.add('active');
            }, 300);
          }, line.time);
        });
      }
      playCycle();
      setInterval(playCycle, 46000);
    }

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        musicBtn.textContent = "🔇 Play";
        isPlaying = false;
      } else {
        audio.play();
        musicBtn.textContent = "🔊 Pause";
        isPlaying = true;
      }
    }

    function createParticles() {
      const icons = ['🦋', '✨', '💛', '✨'];
      const screen = document.getElementById('main-screen');
      setInterval(() => {
        const el = document.createElement('div');
        el.className = 'particle';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (6 + Math.random() * 5) + 's';
        screen.appendChild(el);
        setTimeout(() => el.remove(), 11000);
      }, 900);
    }
  </script>
</body>
</html>
